name: Build Liquid Glass Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O /tmp/android-tools.zip

          mkdir -p /tmp/android-tools
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools

          mv /tmp/android-tools/cmdline-tools \
            "$ANDROID_HOME/cmdline-tools/latest"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar aplicativo
        shell: bash
        run: |
          set -e
          gradle --no-daemon assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::O APK não foi gerado."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::O arquivo APK está vazio."
            exit 1
          fi

          unzip -t "$APK"

          unzip -l "$APK" | grep -q "classes.dex" || {
            echo "::error::O APK não contém classes.dex."
            exit 1
          }

          unzip -l "$APK" | grep -q "AndroidManifest.xml" || {
            echo "::error::O APK não contém AndroidManifest.xml."
            exit 1
          }

          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"

          "$AAPT" dump badging "$APK" > /tmp/apk-info.txt

          grep -Fq "package: name='com.liquidglass.launcher'" \
            /tmp/apk-info.txt || {
            echo "::error::O pacote do aplicativo não corresponde ao esperado."
            cat /tmp/apk-info.txt
            exit 1
          }

          grep -Fq "com.liquidglass.launcher.MainActivity" \
            /tmp/apk-info.txt || {
            echo "::error::A atividade principal não foi identificada no manifesto."
            cat /tmp/apk-info.txt
            exit 1
          }

          echo "APK gerado e verificações básicas concluídas."

      - name: Disponibilizar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
