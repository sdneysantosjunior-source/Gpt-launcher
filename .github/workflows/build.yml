
name: Build Liquid Glass Launcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK_DIR="$HOME/android-sdk"
          mkdir -p "$SDK_DIR"

          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          if [ ! -x "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_DIR/cmdline-tools"

            curl -fsSL \
              https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -o /tmp/android-tools.zip

            mkdir -p /tmp/android-tools
            unzip -q /tmp/android-tools.zip -d /tmp/android-tools

            rm -rf "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/android-tools/cmdline-tools \
              "$SDK_DIR/cmdline-tools/latest"
          fi

          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" \
            --sdk_root="$SDK_DIR" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -x "$SDK_DIR/build-tools/35.0.0/aapt"
          test -x "$SDK_DIR/build-tools/35.0.0/dexdump"

          echo "Android SDK instalado corretamente."

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        shell: bash
        run: |
          set -euo pipefail
          echo "Android SDK: $ANDROID_HOME"
          gradle --no-daemon assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          DEXDUMP="$ANDROID_HOME/build-tools/35.0.0/dexdump"

          if [ ! -f "$APK" ]; then
            echo "::error::APK não encontrado."
            exit 1
          fi

          echo "Tamanho do APK:"
          stat -c '%s bytes' "$APK"

          echo "Conferindo arquivos internos..."

          for item in \
            classes.dex \
            AndroidManifest.xml \
            resources.arsc; do
            if ! unzip -Z1 "$APK" | grep -Fxq "$item"; then
              echo "::error::Arquivo ausente no APK: $item"
              exit 1
            fi
          done

          echo "Conferindo pacote e Activity..."

          "$AAPT" dump badging "$APK" > /tmp/badging.txt

          if ! grep -Fq \
            "package: name='com.liquidglass.launcher'" \
            /tmp/badging.txt; then
            echo "::error::Pacote do aplicativo não confirmado."
            exit 1
          fi

          if ! grep -Fq \
            "launchable-activity: name='com.liquidglass.launcher.MainActivity'" \
            /tmp/badging.txt; then
            echo "::error::Activity principal não confirmada."
            cat /tmp/badging.txt
            exit 1
          fi

          echo "Pacote e Activity confirmados."

          echo "Conferindo manifesto..."

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml \
            > /tmp/manifest-tree.txt

          for item in \
            "android.intent.action.MAIN" \
            "android.intent.category.HOME" \
            "android.intent.category.DEFAULT" \
            "android.intent.category.LEANBACK_LAUNCHER"; do
            if ! grep -Fq "$item" /tmp/manifest-tree.txt; then
              echo "::error::Filtro ausente no manifesto: $item"
              exit 1
            fi
          done

          echo "Filtros necessários encontrados no manifesto."

          echo "Conferindo classe MainActivity..."

          unzip -p "$APK" classes.dex > /tmp/classes.dex

          if [ ! -s /tmp/classes.dex ]; then
            echo "::error::classes.dex está vazio."
            exit 1
          fi

          "$DEXDUMP" -d /tmp/classes.dex > /tmp/dexdump.txt

          if ! grep -Fq \
            'Lcom/liquidglass/launcher/MainActivity;' \
            /tmp/dexdump.txt; then
            echo "::error::MainActivity não encontrada no DEX."
            exit 1
          fi

          echo "Classe MainActivity confirmada."
          echo "Todas as verificações passaram."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
